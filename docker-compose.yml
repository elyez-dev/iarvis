version: '3.8'

services:

  ollama:
    image: ollama/ollama:latest
    container_name: iarvis_ollama
    restart: always
    volumes:
      - ./ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:--1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - iarvis_network

  n8n:
    image: n8nio/n8n:latest
    container_name: iarvis_n8n
    restart: always
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-n8n}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_PUBLIC_URL}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED:-false}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
    volumes:
      - ./n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - iarvis_network
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: iarvis_backend
    restart: always
    volumes:
      - ./backend:/app
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import httpx; r=httpx.get('http://localhost:8000/frontend/settings',timeout=5); assert r.status_code==200\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook-test}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-long_term_memory}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text:latest}
      - DGRAPH_GRPC_URL=${DGRAPH_GRPC_URL:-dgraph:9080}
      - POSTGRES_URL=${POSTGRES_URL:-postgres://n8n_user:n8n_password@postgres:5432/chat_history}
    networks:
      - iarvis_network
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_healthy
      ollama:
        condition: service_healthy
      dgraph:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    container_name: iarvis_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_password}
      - POSTGRES_DB=${POSTGRES_DB:-chat_history}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-n8n_user} -d $${POSTGRES_DB:-chat_history} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - iarvis_network

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: iarvis_pgweb
    restart: unless-stopped
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-n8n_user}:${POSTGRES_PASSWORD:-n8n_password}@postgres:5432/${POSTGRES_DB:-chat_history}?sslmode=disable
    networks:
      - iarvis_network
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: iarvis_qdrant
    restart: unless-stopped
    # Port no expuesto al host — solo accesible desde la red Docker interna
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}
    volumes:
      - ./qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333 && echo OK || exit 1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - iarvis_network

  dgraph:
    image: dgraph/standalone:latest
    container_name: iarvis_dgraph
    restart: unless-stopped
    ports:
      - "${DGRAPH_HTTP_PORT:-8082}:8080"
    # gRPC no expuesto al host — solo red Docker interna
    volumes:
      - ./dgraph-data:/dgraph
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health?all=1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - iarvis_network

  ratel:
    image: dgraph/ratel:latest
    container_name: iarvis_ratel
    restart: unless-stopped
    ports:
      - "${DGRAPH_RATEL_PORT:-8001}:8000"
    networks:
      - iarvis_network
    depends_on:
      dgraph:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: iarvis_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:8000
      - BACKEND_PORT=${BACKEND_PORT:-8000}
    networks:
      - iarvis_network
    depends_on:
      backend:
        condition: service_healthy

networks:
  iarvis_network:
    driver: bridge

volumes:
  huggingface_cache:
